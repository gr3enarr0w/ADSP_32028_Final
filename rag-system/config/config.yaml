qdrant:
  host: ${QDRANT_URL:-localhost}
  port: ${QDRANT_PORT:-6333}
  api_key: ${QDRANT_API_KEY:-}
  collection_prefix: rag_

embedding:
  model_name: BAAI/bge-small-en-v1.5
  dimension: 384
  sparse_model_name: Qdrant/bm25        # NEW — fastembed sparse model id

indexing:
  mode: light  # light | balanced | full
  # child_chunk_size / child_chunk_overlap / parent_chunk_size are TOKEN counts,
  # not character counts, as of 2026-07-16 (see docs/CHANGELOG.md). They are
  # measured using the embedding model's own HuggingFace tokenizer
  # (BAAI/bge-small-en-v1.5 -> BertTokenizer, self.embed_model.tokenizer in
  # EfficientRAG._token_len), which is what actually determines both the
  # embedding model's truncation point (max_seq_length=512 tokens for
  # bge-small) and roughly what an LLM sees per chunk — character count is
  # only a proxy for that and varies with content density (dense technical
  # text runs fewer chars/token than plain prose).
  #
  # Defaults were re-derived (not just relabeled) when switching units: the
  # old character-based defaults (400/1800/50) came from an era with a
  # different sizing unit, and English text through this tokenizer averages
  # roughly 4.5-5.3 chars/token, so re-using the same *numbers* as token
  # counts would have made child chunks ~4-5x larger than originally intended
  # (400 tokens is a hefty child chunk, not a small precise-retrieval one).
  # These new defaults preserve the original *intended* granularity instead:
  # small child chunks for precise retrieval, parent chunks large enough for
  # full context, both comfortably under the 512-token embedding limit.
  child_chunk_size: 100      # ~= former 400 chars / ~4.5 chars-per-token
  child_chunk_overlap: 20    # ~= former 50 chars / ~4.5 chars-per-token
  parent_chunk_size: 400     # ~= former 1800 chars / ~4.5 chars-per-token
  use_hierarchical: true
  use_contextual_summaries: true
  quantization: binary  # binary | scalar_int8 | none  (still the user's *requested* mode)
  hybrid_search: true
  force_binary: false                    # NEW — explicit escape hatch, see guard rule below
  binary_dim_threshold: 1024             # NEW — dimension floor for allowing binary quantization

retrieval:
  top_k_children: 8
  oversampling: 3.0
  fetch_parents: true                    # expands each hit's "text" to the full parent-chunk
                                          # text at query time (see docs/CHANGELOG.md)
  rerank: true                           # NEW — enable/disable cross-encoder rerank stage
  reranker_model: cross-encoder/ms-marco-MiniLM-L-6-v2   # NEW
  rerank_candidate_pool: 40              # NEW — how many hybrid hits to fetch before rerank (25-50 range)
  rerank_top_n: 8                        # NEW — final count after rerank (defaults to top_k_children if unset)
  rrf_k: 60                              # RRF rank-fusion smoothing constant (client-side fusion, since Qdrant's server-side RRF has no tunable k)
  context_review_enabled: false          # NEW — optional CRAG-style ("decompose-then-recompose", arXiv:2401.15884)
                                          # sentence-level context review/distillation pass, run after reranking and
                                          # parent-chunk expansion, before generation (see EfficientRAG.retrieve() /
                                          # review_and_distill_context() in scripts/utils.py, and docs/CHANGELOG.md).
                                          # OFF by default — experimental, not proven to help end-to-end yet, and
                                          # explicitly NOT expected to fix the faithfulness regression documented
                                          # elsewhere in this file / evaluate_ragas.py (that's caused by
                                          # generate_answer()'s attribution-tagged blending policy, a different
                                          # problem). Targets context_precision instead.
  context_review_threshold: 0.3          # NEW — per-sentence relevance score (0.0-1.0, from a cheap Haiku-class LLM
                                          # call) below which a sentence is discarded when context_review_enabled is
                                          # true. Deliberately lenient default: biases toward keeping borderline
                                          # sentences, since dropping a genuinely relevant one hurts context_recall
                                          # more than keeping a mildly noisy one hurts context_precision.
  adaptive_retrieval_enabled: false      # NEW — Adaptive-RAG-lite: gate the retrieval pipeline behind a single
                                          # cheap LLM call that classifies the query as "none" (skip retrieval
                                          # entirely — answerable from general knowledge) or "light" (normal
                                          # retrieval) BEFORE hybrid search / rerank / parent expansion / context
                                          # review run (see EfficientRAG._classify_retrieval_need() /
                                          # EfficientRAG.retrieve() in scripts/utils.py, and docs/CHANGELOG.md).
                                          # OFF by default — v1 scope is "none" vs "light" only, no third "deep"
                                          # tier yet, and UNVALIDATED (no A/B run against the NFCorpus testset yet).
  adaptive_retrieval_model: "glm-5.2:cloud"  # NEW — model name used for the classification call (interpretation
                                          # depends on adaptive_retrieval_provider, e.g. an Ollama model tag).
  adaptive_retrieval_provider: "ollama"  # NEW — "ollama" | "neuralwatt" | "claude". Unknown values raise
                                          # ValueError immediately (fail loud on config typos).
  adaptive_light_top_k: 8                # NEW — top_k override applied for this call when the gate picks "light".
  adaptive_light_oversampling: 3.0       # NEW — oversampling override applied for this call when the gate picks
                                          # "light".
  adaptive_retrieval_fallback_strategy: "light"  # NEW — strategy to fail open to on any classifier call/parse/
                                          # provider error (never "none" — a classifier hiccup must never skip
                                          # retrieval outright).
  adaptive_parent_expansion_enabled: true  # NEW — query-adaptive parent-chunk expansion sub-gate (see
                                          # EfficientRAG.retrieve()'s fetch_parents block in scripts/utils.py,
                                          # docs/RESEARCH_NOTES.md §6, docs/ARCHITECTURE.md §4.6). Only takes
                                          # effect when adaptive_retrieval_enabled AND fetch_parents are both
                                          # true; when so, reuses that SAME query's classification call (no
                                          # extra LLM call) to decide per-query whether to actually expand to
                                          # parent-chunk text, instead of always expanding whenever the static
                                          # fetch_parents toggle says to. Kept as a SEPARATE toggle from
                                          # adaptive_retrieval_enabled (not folded into it) so this specific
                                          # sub-feature can be isolated independently in a future A/B validation
                                          # of which half of the gate (retrieval-depth routing vs. parent-
                                          # expansion gating) is responsible for any measured effect. Default
                                          # true — this new query-adaptive behavior IS the fix being shipped as
                                          # soon as the two prerequisite flags above are both on. UNVALIDATED
                                          # (implemented but no A/B run against the NFCorpus testset yet — see
                                          # docs/CHANGELOG.md).
  adaptive_skip_none_strategy: false     # NEW — isolation flag for testing adaptive_parent_expansion_enabled
                                          # WITHOUT the unrelated "none"-strategy skip-retrieval gate confounding
                                          # the result (see docs/CHANGELOG.md's 2026-07-20 entry). The gate's
                                          # single classification call still ALWAYS runs and both "strategy" and
                                          # "needs_broad_context" are still computed/recorded exactly as before —
                                          # this flag only controls whether retrieve() is allowed to short-circuit
                                          # to an empty result when strategy == "none". Default false: behavior is
                                          # completely unchanged from before this flag existed — a "none"
                                          # classification still returns [] immediately. Set true to suppress ONLY
                                          # that skip: a "none" verdict is then treated as "light" for the purposes
                                          # of whether retrieval actually runs (same top_k/oversampling override
                                          # path as a genuine "light" verdict), while self._last_retrieval_strategy
                                          # still records the RAW classifier verdict ("none") for audit/logging —
                                          # only the skip BEHAVIOR is suppressed, not the classification itself.
                                          # This exists because on this project's title-style NFCorpus testset
                                          # (bare document titles like "leeks"/"serotonin"/"veal", not natural
                                          # questions), the none-skip gate misfires ~23-25% of the time, judging
                                          # bare nouns as "general knowledge, no retrieval needed" and forcing
                                          # RAGAS faithfulness to 0 for those rows — a confound that explained most
                                          # of a previously-measured faithfulness collapse when testing
                                          # adaptive_parent_expansion_enabled (which requires adaptive_retrieval_
                                          # enabled: true to run at all, but that flag also activates this
                                          # unrelated none-skip gate). Setting this true lets parent-expansion be
                                          # A/B tested in isolation from that confound.
  hyde_enabled: false                    # NEW — HyDE (Hypothetical Document Embeddings, Gao et al.
                                          # arXiv:2212.10496): generate a hypothetical answer passage via one
                                          # cheap LLM call and embed THAT for the DENSE search leg only, instead
                                          # of the literal query (see EfficientRAG._generate_hyde_document() /
                                          # EfficientRAG.retrieve() in scripts/utils.py, and docs/CHANGELOG.md).
                                          # OFF by default — UNVALIDATED (no A/B run against the NFCorpus testset
                                          # yet). Targets a documented lay-query vs. clinical-document vocabulary
                                          # mismatch (see docs/ARCHITECTURE.md §4.5). The sparse/BM25 leg and the
                                          # cross-encoder rerank step both still use/reference the literal query.
  hyde_model: "glm-5.2:cloud"            # NEW — model used for HyDE's hypothetical-document generation call.
  hyde_provider: "ollama"                # NEW — "ollama" | "neuralwatt" | "claude". Unknown values raise
                                          # ValueError immediately (fail loud on config typos), same as
                                          # adaptive_retrieval_provider.
  mmr_enabled: false                     # NEW — MMR (Maximal Marginal Relevance, Carbonell & Goldstein,
                                          # SIGIR '98) diversity-aware selection pass, run AFTER
                                          # cross-encoder reranking (which still does the initial
                                          # relevance-based ordering) and BEFORE parent-chunk expansion /
                                          # CRAG context review (see EfficientRAG._apply_mmr() /
                                          # EfficientRAG.retrieve() in scripts/utils.py, and
                                          # docs/RESEARCH_NOTES.md §4 / docs/CHANGELOG.md). Reuses each
                                          # candidate's already-computed dense embedding (no re-embedding
                                          # round trip) to penalize near-duplicate/highly-overlapping
                                          # chunks that would otherwise crowd out unique information under
                                          # a relevance-only reranker — a plausible issue specifically for
                                          # this project's gold+distractor-document eval corpus shape. OFF
                                          # by default — UNVALIDATED (no A/B run against the NFCorpus
                                          # testset yet), and a plain on/off toggle independent of the
                                          # Adaptive-RAG-lite needs_broad_context gate (v1 scope,
                                          # deliberately not cross-wired to it — see docs/CHANGELOG.md).
  mmr_lambda: 0.6                        # NEW — relevance/diversity trade-off in [0.0, 1.0]: 1.0 = pure
                                          # relevance (degenerates to the pre-MMR ranking order), 0.0 =
                                          # pure diversity. 0.6 is a relevance-leaning middle of the
                                          # standard 0.5-0.7 RAG range, pending empirical tuning.

# Google Workspace (Drive/Docs/Sheets) READ-ONLY ingestion connector
# (scripts/google_workspace.py, wired into scripts/ingest.py via --gdrive-query /
# --gdoc-id / --gsheet-id). This is a completely independent Google integration
# using your own Google Cloud API project's OAuth2 "Desktop app" credentials.
# It only requests drive.readonly / documents.readonly / spreadsheets.readonly
# scopes (no write access).
#
# Credentials are stored in a .credentials/ directory (excluded via .gitignore).
# Set paths via environment variables or update below.
google_workspace:
  client_secret_path: ${GOOGLE_WORKSPACE_CLIENT_SECRET_PATH:-.credentials/client_secret.json}
  token_path: ${GOOGLE_WORKSPACE_TOKEN_PATH:-.credentials/token.json}

# Document source ingestion
# Supports local files, URLs, APIs, and pre-dumped document collections
# Use --confluence-dump-dir for pre-dumped structured document collections
# See scripts/ingest.py for full list of supported data sources
