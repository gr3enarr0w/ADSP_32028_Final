apiVersion: batch/v1
kind: CronJob
metadata:
  name: ai-helpdesk-pipeline
  namespace: jira-messaging--runtime-ext
spec:
  # Run every 15 minutes — pipeline itself rate-limits via lock
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: pipeline
              image: ghcr.io/agile-tech-sol/ai-helpdesk-agent:latest
              command:
                - python
                - faq_service.py
                - run
              resources:
                requests:
                  cpu: "250m"
                  memory: "512Mi"
                limits:
                  cpu: "1000m"
                  memory: "1Gi"
              envFrom:
                - configMapRef:
                    name: ai-helpdesk-agent-config
                - secretRef:
                    name: ai-helpdesk-agent-secrets
              env:
                - name: GOOGLE_SERVICE_ACCOUNT_JSON
                  value: /app/secrets/service_account.json
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                seccompProfile:
                  type: RuntimeDefault
              volumeMounts:
                - name: sa-json
                  mountPath: /app/secrets
                  readOnly: true
          imagePullSecrets:
            - name: ghcr-pull-secret
          volumes:
            - name: sa-json
              secret:
                secretName: ai-helpdesk-agent-sa-json
