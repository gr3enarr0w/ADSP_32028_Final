# GitHub Actions self-hosted runner — runs inside the cluster so the deploy job
# authenticates via the pod's mounted SA token (no external OCP token needed).
#
# One-time setup:
#   1. Create the GitHub App secret:
#      oc create secret generic github-runner-app \
#        --from-literal=GITHUB_APP_ID=<app-id> \
#        --from-literal=GITHUB_APP_INSTALL_ID=<installation-id> \
#        --from-file=GITHUB_APP_PEM=<path-to-private-key.pem> \
#        -n jira-messaging--runtime-ext
#
#   2. Apply this manifest:
#      oc apply -f deploy/openshift/runner-deployment.yaml -n jira-messaging--runtime-ext
#
#   3. Confirm runner registered:
#      oc logs -l app=github-actions-runner -n jira-messaging--runtime-ext
#      github.com/agile-tech-sol/ai-helpdesk-agent → Settings → Actions → Runners
#
# The runner registers with label "openshift" — build.yml deploy job targets it via:
#   runs-on: [self-hosted, openshift]
#
# GitHub App private key never expires. No token rotation required.
# All OCP operations use the pod's in-cluster SA token (github-actions-ci).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: github-actions-runner
  namespace: jira-messaging--runtime-ext
  labels:
    app: github-actions-runner
spec:
  replicas: 1
  selector:
    matchLabels:
      app: github-actions-runner
  template:
    metadata:
      labels:
        app: github-actions-runner
    spec:
      serviceAccountName: github-actions-ci
      securityContext:
        runAsNonRoot: true
      containers:
        - name: runner
          image: ghcr.io/agile-tech-sol/ai-helpdesk-agent-runner:latest
          imagePullPolicy: Always
          env:
            - name: GITHUB_APP_ID
              valueFrom:
                secretKeyRef:
                  name: github-runner-app
                  key: GITHUB_APP_ID
            - name: GITHUB_APP_INSTALL_ID
              valueFrom:
                secretKeyRef:
                  name: github-runner-app
                  key: GITHUB_APP_INSTALL_ID
            - name: GITHUB_APP_PEM
              valueFrom:
                secretKeyRef:
                  name: github-runner-app
                  key: GITHUB_APP_PEM
            - name: GITHUB_OWNER
              value: agile-tech-sol
            - name: GITHUB_REPOSITORY
              value: ai-helpdesk-agent
            - name: RUNNER_LABELS
              value: openshift
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
