apiVersion: v1
kind: ServiceAccount
metadata:
  name: github-actions-ci
  namespace: jira-messaging--runtime-ext
---
# OCP 4.11+ no longer auto-creates long-lived SA token secrets.
# This secret is bound to the SA above and does not expire.
# After applying, retrieve the token with:
#   oc get secret github-actions-ci-token -n jira-messaging--runtime-ext \
#     -o jsonpath='{.data.token}' | base64 -d
# Store the output as the OPENSHIFT_TOKEN GitHub Actions secret.
apiVersion: v1
kind: Secret
metadata:
  name: github-actions-ci-token
  namespace: jira-messaging--runtime-ext
  annotations:
    kubernetes.io/service-account.name: github-actions-ci
type: kubernetes.io/service-account-token
---
# RoleBinding: grants edit access within jira-messaging--runtime-ext only.
# edit covers: oc apply, oc create secret, oc set image, oc rollout status.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: github-actions-ci-edit
  namespace: jira-messaging--runtime-ext
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: edit
subjects:
  - kind: ServiceAccount
    name: github-actions-ci
    namespace: jira-messaging--runtime-ext
