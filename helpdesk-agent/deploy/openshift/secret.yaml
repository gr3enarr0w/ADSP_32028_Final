# IMPORTANT: Before applying this secret, populate all empty "" values with real credentials.
# These values are normally populated by the CI/CD pipeline via Bitwarden SM.
# For manual deployment, source values from Bitwarden or the .env file (NOT .env itself).
#
# ADDITIONAL SECRETS required (not in this file — create manually):
#   1. ghcr-pull-secret (image pull):
#      oc create secret docker-registry ghcr-pull-secret \
#        --docker-server=ghcr.io --docker-username=<github-user> \
#        --docker-password=<github-pat> -n jira-messaging--runtime-ext
#
#   2. ai-helpdesk-agent-sa-json (Google service account JSON file):
#      oc create secret generic ai-helpdesk-agent-sa-json \
#        --from-file=service_account.json=./service_account.json \
#        -n jira-messaging--runtime-ext
apiVersion: v1
kind: Secret
metadata:
  name: ai-helpdesk-agent-secrets
  namespace: jira-messaging--runtime-ext
type: Opaque
stringData:
  # 3-token product-based OAuth 2LO — all on the same service account
  # JSM token (20 scopes: read:jira-work + JSM read/write)
  JSM_CLIENT_ID: ""
  JSM_CLIENT_SECRET: ""
  # Jira token (26 scopes: Jira read/write)
  JIRA_CLIENT_ID: ""
  JIRA_CLIENT_SECRET: ""
  # Confluence token (7 scopes: Confluence read/write)
  CONFLUENCE_CLIENT_ID: ""
  CONFLUENCE_CLIENT_SECRET: ""

  # Atlassian Cloud base URL
  JSM_CLOUD_URL: "https://stage-<YOUR_DOMAIN>.atlassian.net"

  # Slack
  SLACK_BOT_TOKEN: ""

  # FAQ API auth token (webhook callers must present this)
  FAQ_API_TOKEN: ""

  # Postgres — set to: postgresql://helpdesk:<password>@postgres:5432/helpdesk
  DATABASE_URL: ""
