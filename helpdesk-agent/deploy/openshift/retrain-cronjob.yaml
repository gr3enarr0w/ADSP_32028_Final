apiVersion: batch/v1
kind: CronJob
metadata:
  name: ai-helpdesk-retrain
  namespace: jira-messaging--runtime-ext
spec:
  # Every Monday at 9am — aligned to sprint cadence
  schedule: "0 9 * * 1"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # Spin up, run, terminate — no restart on failure (use backoffLimit instead)
      activeDeadlineSeconds: 14400
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: retrain
              image: ghcr.io/agile-tech-sol/ai-helpdesk-agent:latest
              command:
                - python
                - -m
                - scripts.retrain
              resources:
                requests:
                  # DistilBERT encoding requires significant memory
                  cpu: "1000m"
                  memory: "2Gi"
                limits:
                  cpu: "2000m"
                  memory: "4Gi"
              envFrom:
                - configMapRef:
                    name: ai-helpdesk-agent-config
                - secretRef:
                    name: ai-helpdesk-agent-secrets
              env:
                - name: GOOGLE_SERVICE_ACCOUNT_JSON
                  value: /app/secrets/service_account.json
                # Minimum training samples per category before skipping it
                - name: MIN_CATEGORY_SAMPLES
                  value: "10"
                # Optuna OOF trials — 200 for scheduled runs (vs 300 for manual)
                - name: N_OOF_TRIALS
                  value: "200"
                # Promotion tolerance: promote if new_f1 >= prev_f1 - 0.01
                - name: PROMOTION_TOLERANCE
                  value: "0.01"
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                seccompProfile:
                  type: RuntimeDefault
              volumeMounts:
                - name: models
                  mountPath: /app/models
                - name: sa-json
                  mountPath: /app/secrets
                  readOnly: true
          imagePullSecrets:
            - name: ghcr-pull-secret
          volumes:
            - name: models
              persistentVolumeClaim:
                claimName: ai-helpdesk-agent-data
            - name: sa-json
              secret:
                secretName: ai-helpdesk-agent-sa-json
