apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: jira-messaging--runtime-ext
type: Opaque
stringData:
  # Set a strong password here. Must match the password in DATABASE_URL in secret.yaml.
  # Example: postgresql://helpdesk:<POSTGRES_PASSWORD>@postgres:5432/helpdesk
  POSTGRES_PASSWORD: ""
  # DATABASE_URL is constructed from the above — set this in the app secret:
  # postgresql://helpdesk:<POSTGRES_PASSWORD>@postgres:5432/helpdesk
