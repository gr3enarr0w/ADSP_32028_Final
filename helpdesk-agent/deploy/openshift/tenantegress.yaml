apiVersion: tenant.paas.redhat.com/v1alpha1
kind: TenantEgress
metadata:
  name: default
  namespace: jira-messaging--runtime-ext
spec:
  egress:
  # Internal Red Hat network
  - to:
      cidrSelector: 172.0.0.0/8
    type: Allow
  - to:
      cidrSelector: 10.0.0.0/8
    type: Allow
  # Amazon MSK (Kafka brokers)
  - to:
      dnsName: b-1.itprod.bvduhl.c8.kafka.us-east-1.amazonaws.com
    type: Allow
  - to:
      dnsName: b-2.itprod.bvduhl.c8.kafka.us-east-1.amazonaws.com
    type: Allow
  - to:
      dnsName: b-3.itprod.bvduhl.c8.kafka.us-east-1.amazonaws.com
    type: Allow
  # AWS S3 (used by Kafka / MSK)
  - to:
      cidrSelector: 52.216.0.0/15
    type: Allow
  - to:
      cidrSelector: 52.92.128.0/17
    type: Allow
  - to:
      cidrSelector: 52.218.128.0/17
    type: Allow
  # Red Hat APIs
  - to:
      dnsName: api.access.redhat.com
    type: Allow
  - to:
      dnsName: cert-api.access.redhat.com
    type: Allow
  - to:
      dnsName: cdn.redhat.com
    type: Allow
  # Atlassian Cloud (Jira, Confluence, JSM)
  - to:
      dnsName: <YOUR_DOMAIN>.atlassian.net
    type: Allow
  - to:
      dnsName: atlassian.net
    type: Allow
  - to:
      dnsName: atlassian.com
    type: Allow
  - to:
      dnsName: hello.atlassian-dev.net
    type: Allow
  - to:
      dnsName: atlassian-dev.net
    type: Allow
  - to:
      dnsName: redhat-development.atlassian.net
    type: Allow
  # Atlassian Cloud IP range
  - to:
      cidrSelector: 104.192.0.0/14
    type: Allow
  # Google APIs (Vertex AI / Gemini, OAuth)
  - to:
      dnsName: oauth2.googleapis.com
    type: Allow
  # GitHub — CI/CD pipeline + self-hosted runner
  - to:
      dnsName: github.com
    type: Allow
  - to:
      dnsName: api.github.com
    type: Allow
  - to:
      dnsName: ghcr.io
    type: Allow
  - to:
      dnsName: codeload.github.com
    type: Allow
  # GitHub Actions runner service endpoints
  - to:
      dnsName: vstoken.actions.githubusercontent.com
    type: Allow
  - to:
      dnsName: pipelines.actions.githubusercontent.com
    type: Allow
  - to:
      dnsName: results-receiver.actions.githubusercontent.com
    type: Allow
  - to:
      dnsName: objects.githubusercontent.com
    type: Allow
  # GitHub Actions Azure infrastructure (dynamic hosts under *.actions.githubusercontent.com).
  # TenantEgress does not support wildcards — specific DNS names + CIDRs used instead.
  # Long-term fix: ANTSE-553 — ITOP ticket to allow *.actions.githubusercontent.com.
  - to:
      dnsName: broker.actions.githubusercontent.com
    type: Allow
  - to:
      cidrSelector: 20.85.0.0/16
    type: Allow
  - to:
      cidrSelector: 20.102.0.0/17
    type: Allow
  # Bitwarden Secrets Manager (CI/CD secret retrieval)
  - to:
      dnsName: api.bitwarden.com
    type: Allow
  - to:
      dnsName: identity.bitwarden.com
    type: Allow
  # GitHub Actions log upload (Azure Blob Storage — productionresultssa*.blob.core.windows.net)
  - to:
      dnsName: productionresultssa0.blob.core.windows.net
    type: Allow
  - to:
      dnsName: productionresultssa1.blob.core.windows.net
    type: Allow
  - to:
      dnsName: productionresultssa2.blob.core.windows.net
    type: Allow
  - to:
      dnsName: productionresultssa3.blob.core.windows.net
    type: Allow
  - to:
      dnsName: productionresultssa4.blob.core.windows.net
    type: Allow
  - to:
      dnsName: productionresultssa5.blob.core.windows.net
    type: Allow
  - to:
      dnsName: productionresultssa6.blob.core.windows.net
    type: Allow
  - to:
      dnsName: productionresultssa7.blob.core.windows.net
    type: Allow
  - to:
      dnsName: productionresultssa8.blob.core.windows.net
    type: Allow
  - to:
      dnsName: productionresultssa9.blob.core.windows.net
    type: Allow
  - to:
      dnsName: productionresultssa10.blob.core.windows.net
    type: Allow
  - to:
      dnsName: productionresultssa11.blob.core.windows.net
    type: Allow
  - to:
      dnsName: productionresultssa12.blob.core.windows.net
    type: Allow
  - to:
      dnsName: productionresultssa13.blob.core.windows.net
    type: Allow
  - to:
      dnsName: productionresultssa14.blob.core.windows.net
    type: Allow
  - to:
      dnsName: productionresultssa15.blob.core.windows.net
    type: Allow
  - to:
      dnsName: productionresultssa16.blob.core.windows.net
    type: Allow
  - to:
      dnsName: productionresultssa17.blob.core.windows.net
    type: Allow
  - to:
      dnsName: productionresultssa18.blob.core.windows.net
    type: Allow
  - to:
      dnsName: productionresultssa19.blob.core.windows.net
    type: Allow
  # Red Hat mirror (oc CLI download via openshift-tools-installer action)
  - to:
      dnsName: mirror.openshift.com
    type: Allow
  # Google Sheets, Docs, and Drive APIs (FAQ article generation and publishing)
  - to:
      dnsName: sheets.googleapis.com
    type: Allow
  - to:
      dnsName: docs.googleapis.com
    type: Allow
  - to:
      dnsName: www.googleapis.com
    type: Allow
  - to:
      dnsName: drive.googleapis.com
    type: Allow
  # Deny all other egress
  - to:
      cidrSelector: 0.0.0.0/0
    type: Deny
