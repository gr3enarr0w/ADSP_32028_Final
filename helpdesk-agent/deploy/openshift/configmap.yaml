apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-helpdesk-agent-config
  namespace: jira-messaging--runtime-ext
data:
  PROJECT_KEYS: "<PROJECT_KEY>"
  CLOUD_CUTOVER_DATE: "2026-03-16"
  GEMINI_PROJECT: "your-gcp-project"
  GEMINI_LOCATION: "global"
  GEMINI_MODEL: "gemini-2.5-flash"
  CONFLUENCE_KB_SPACE: "HUB"
  FAQ_CONFLUENCE_SPACES: "HUB,OMEGA"
  AUTO_DRAFT_ALL: "true"
  AUTO_RESPOND_ASSIGNEES: "5f7dd332837bb8006863d4d3,5e60a8d61fbb870afbe3678c"
  DATA_DIR: "/app/models"
  # DATABASE_URL is a Secret, not a ConfigMap entry — set it via OpenShift Secret
  # and mount as DATABASE_URL env var in the deployment. When set, SQLite is not used.
  DISABLE_DOCS: "true"
  # Stage: 120848404 (AI-Generated FAQ Articles in HUB, stage-<YOUR_DOMAIN>.atlassian.net)
  # Prod:  118685697 (AI-Generated FAQ Articles in HUB, <YOUR_DOMAIN>.atlassian.net)
  CONFLUENCE_PARENT_PAGE_ID: "120947227"
  # Embedding provider — vertex uses gemini-embedding-001 via GCP API (same creds as Gemini)
  # MiniLM (384-dim) on PVC is for sentiment/classification models only, not dedup
  EMBEDDING_PROVIDER: "vertex"
