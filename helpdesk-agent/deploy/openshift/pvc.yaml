# ReadWriteMany: allows the Deployment and the retrain CronJob to mount the PVC
# simultaneously from different nodes. Requires an RWX-capable storage class
# (e.g. NFS via Trident CSI). No podAffinity or node pinning is needed.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ai-helpdesk-agent-data
  namespace: jira-messaging--runtime-ext
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: rh-internal-nfs
  resources:
    requests:
      storage: 5Gi
